name: Build & Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole `
                      --onefile `
                      --clean `
                      --icon="assets/icon.ico" `
                      --add-data="assets;assets" `
                      --name="ImageOptimizer-windows-x64" `
                      main_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-exe
          path: dist/ImageOptimizer-windows-x64.exe

  build-linux-x64:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole \
                      --onefile \
                      --clean \
                      --add-data="assets:assets" \
                      --name="ImageOptimizer-linux-x86_64" \
                      main_gui.py
          chmod +x dist/ImageOptimizer-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-bin
          path: dist/ImageOptimizer-linux-x86_64

  build-linux-arm64:
    name: Build Linux ARM64 (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole \
                      --onefile \
                      --clean \
                      --add-data="assets:assets" \
                      --name="ImageOptimizer-linux-arm64" \
                      main_gui.py
          chmod +x dist/ImageOptimizer-linux-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-bin
          path: dist/ImageOptimizer-linux-arm64

  build-macos:
    name: Build macOS (.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS .app
        run: |
          pyinstaller --windowed \
                      --clean \
                      --add-data="assets:assets" \
                      --name="ImageOptimizer" \
                      main_gui.py

      - name: Package .app into Zip and DMG
        run: |
          cd dist
          zip -r ImageOptimizer-macos-app.zip ImageOptimizer.app
          hdiutil create -volname "Image Optimizer" -srcfolder ImageOptimizer.app -ov -format UDZO ImageOptimizer-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/ImageOptimizer-macos.dmg
            dist/ImageOptimizer-macos-app.zip

  create-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux-x64, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find release-assets -type f -exec mv {} release-files/ \;
          ls -la release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          name: "Image Optimizer ${{ github.ref_name }}"
          body: |
            ## 🚀 Image Optimizer ${{ github.ref_name }} Release
            
            All-in-one cross-platform image & animation optimizer (WebP, JPG).
            
            ### 📦 Download Assets
            - **Windows**: `ImageOptimizer-windows-x64.exe` (Single standalone portable executable)
            - **macOS**: `ImageOptimizer-macos.dmg` / `ImageOptimizer-macos-app.zip` (Apple Silicon & Intel)
            - **Linux x86_64**: `ImageOptimizer-linux-x86_64` (ELF standalone binary)
            - **Linux ARM64 (aarch64)**: `ImageOptimizer-linux-arm64` (Raspberry Pi 4/5, ARM SBCs, Cloud ARM)
            
            ### 💖 Support & Sponsor
            If you find this project useful, consider sponsoring the author!
          draft: false
          prerelease: false
