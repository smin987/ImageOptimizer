name: Build & Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify License Compliance (License Guard)
        shell: bash
        run: |
          if grep -qi "apache license" LICENSE; then
            echo "::error::Incompatible license terms found in LICENSE! Release blocked."
            exit 1
          fi
          echo "License guard passed: Fair-Code verified."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole `
                      --onefile `
                      --clean `
                      --icon="assets/icon.ico" `
                      --add-data="assets;assets" `
                      --add-data="THIRD_PARTY_LICENSES.md;." `
                      --add-data="LICENSE;." `
                      --hidden-import="PIL._imagingcms" `
                      --hidden-import="PIL.ImageCms" `
                      --name="ImageOptimizer-windows-x64" `
                      main_gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-exe
          path: dist/ImageOptimizer-windows-x64.exe

  build-linux-x64:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole \
                      --onefile \
                      --clean \
                      --add-data="assets:assets" \
                      --name="ImageOptimizer-linux-x86_64" \
                      main_gui.py
          chmod +x dist/ImageOptimizer-linux-x86_64

      - name: Build Debian (.deb) package
        run: |
          chmod +x build/package_deb.sh
          ./build/package_deb.sh amd64 "${{ github.ref_name || '1.0.3' }}" dist/ImageOptimizer-linux-x86_64 dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-bin
          path: |
            dist/ImageOptimizer-linux-x86_64
            dist/*.deb

  build-linux-arm64:
    name: Build Linux ARM64 (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconsole \
                      --onefile \
                      --clean \
                      --add-data="assets:assets" \
                      --name="ImageOptimizer-linux-arm64" \
                      main_gui.py
          chmod +x dist/ImageOptimizer-linux-arm64

      - name: Build Debian (.deb) package
        run: |
          chmod +x build/package_deb.sh
          ./build/package_deb.sh arm64 "${{ github.ref_name || '1.0.3' }}" dist/ImageOptimizer-linux-arm64 dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-bin
          path: |
            dist/ImageOptimizer-linux-arm64
            dist/*.deb

  build-macos:
    name: Build macOS (.app & .dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS .app
        run: |
          pyinstaller --windowed \
                      --clean \
                      --add-data="assets:assets" \
                      --name="ImageOptimizer" \
                      main_gui.py

      - name: Package .app into Zip and DMG
        run: |
          cd dist
          zip -r ImageOptimizer-macos-app.zip ImageOptimizer.app
          hdiutil create -volname "Image Optimizer" -srcfolder ImageOptimizer.app -ov -format UDZO ImageOptimizer-macos.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/ImageOptimizer-macos.dmg
            dist/ImageOptimizer-macos-app.zip

  create-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux-x64, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find release-assets -type f -exec mv {} release-files/ \;
          ls -la release-files

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          name: "Image Optimizer ${{ github.ref_name }}"
          body: |
            ## 🚀 Image Optimizer ${{ github.ref_name }} Release
            
            All-in-one cross-platform image & animation optimizer (WebP, JPG).
            
            ### 📦 Download Assets & Packages
            - **Windows**: `ImageOptimizer-windows-x64.exe` (Single standalone portable executable)
            - **macOS**: `ImageOptimizer-macos.dmg` / `ImageOptimizer-macos-app.zip` (Apple Silicon & Intel)
            - **Linux (Debian/Ubuntu/Raspberry Pi .deb)**:
              - `ImageOptimizer_${{ github.ref_name }}_amd64.deb` (`sudo apt install ./ImageOptimizer_*.deb`)
              - `ImageOptimizer_${{ github.ref_name }}_arm64.deb` (`sudo apt install ./ImageOptimizer_*.deb`)
            - **Linux (Standalone Binaries)**:
              - `ImageOptimizer-linux-x86_64`
              - `ImageOptimizer-linux-arm64` (Raspberry Pi 4/5, ARM SBCs, Cloud ARM)
            
            ### 🍺 Homebrew (macOS)
            ```bash
            brew install --cask https://raw.githubusercontent.com/smin987/ImageOptimizer/main/build/homebrew/Casks/image-optimizer.rb
            ```

            ### 🐧 APT Repository (Ubuntu / Debian / Raspberry Pi)
            ```bash
            curl -fsSL https://smin987.github.io/ImageOptimizer/repo.key | sudo gpg --dearmor -o /etc/apt/keyrings/image-optimizer.gpg
            echo "deb [signed-by=/etc/apt/keyrings/image-optimizer.gpg] https://smin987.github.io/ImageOptimizer ./" | sudo tee /etc/apt/sources.list.d/image-optimizer.list
            sudo apt update && sudo apt install image-optimizer
            ```

            ### 🪟 Windows 11 / 10
            Download the standalone portable `.exe` directly or install via `winget`:
            ```powershell
            winget install smin987.ImageOptimizer
            ```

            ### 📄 License
            This software is distributed under the **[Image Optimizer Fair-Code License](https://github.com/smin987/ImageOptimizer/blob/main/LICENSE)**.
            The source code is public for research and Pull Requests (public distribution of forks & competing products prohibited), while compiled binaries are 100% free to use for personal and commercial purposes.

            ---

            ### 💖 Support & Sponsorship

            If you find this project valuable, please consider sponsoring the developer. Your support directly helps maintain the project, cover infrastructure costs, improve performance, and build new features! ☕✨

            <div align="center">

            [![GitHub Sponsors](https://img.shields.io/badge/GitHub-Sponsors-ea4aaa?style=for-the-badge&logo=github&logoColor=white)](https://github.com/sponsors/smin987) &nbsp; [![Buy Me A Coffee](https://img.shields.io/badge/Buy_Me_A_Coffee-FFDD00?style=for-the-badge&logo=buy-me-a-coffee&logoColor=black)](https://www.buymeacoffee.com/smin987) &nbsp; [![Ko-Fi](https://img.shields.io/badge/Ko--fi-F16061?style=for-the-badge&logo=ko-fi&logoColor=white)](https://ko-fi.com/smin987)

            </div>
          draft: false
          prerelease: false

  publish-apt-repo:
    name: Publish Official APT Repository to GitHub Pages
    needs: [create-release]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: deb-artifacts

      - name: Setup APT Repository files
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gnupg apt-utils

          # 수집된 .deb 파일들을 gh-pages 루트로 복사
          find deb-artifacts -name "*.deb" -exec cp {} ./ \;
          ls -la *.deb

          # GPG 키 생성 (배포 서명용)
          cat << 'EOF' > gpg-batch
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Subkey-Type: RSA
          Subkey-Length: 4096
          Name-Real: Image Optimizer Archive
          Name-Email: smin987@users.noreply.github.com
          Expire-Date: 0
          EOF
          gpg --batch --generate-key gpg-batch
          rm -f gpg-batch
          gpg --armor --export "Image Optimizer Archive" > repo.key

          # Packages & Packages.gz 생성
          dpkg-scanpackages --multiversion . > Packages
          gzip -9c Packages > Packages.gz

          # Release 파일 생성
          cat << 'EOF' > Release
          Origin: Image Optimizer
          Label: Image Optimizer
          Suite: stable
          Codename: stable
          Architectures: amd64 arm64
          Components: main
          Description: Official APT Repository for Image Optimizer
          EOF
          apt-ftparchive release . >> Release

          # InRelease 및 Release.gpg 서명
          rm -f InRelease Release.gpg
          gpg --batch --yes --no-tty --default-key "Image Optimizer Archive" --clearsign -o InRelease Release
          gpg --batch --yes --no-tty --default-key "Image Optimizer Archive" -abs -o Release.gpg Release

          rm -rf deb-artifacts

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false
